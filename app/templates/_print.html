<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/static/app.css?v={{ ASSET_V }}"><script src="/static/app.js?v={{ ASSET_V }}"></script></head>
<body class="print-page">
<div class="actions no-print" style="justify-content:center;padding:1rem"><button class="btn primary" type="button" data-print>طباعة / حفظ PDF</button></div>
<article class="official">
{% block letter %}{% endblock %}
<footer class="letter-foot">صدر هذا المستند إلكترونياً من نظام «{{ org.system_title }}» — {{ org.university }} · {{ org.college }}</footer>
</article>
</body></html>
