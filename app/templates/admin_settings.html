{% extends "base.html" %}
{% from "_macros.html" import settings_tabs %}
{% block title %}هوية الجهة{% endblock %}
{% block heading %}الإعدادات{% endblock %}
{% block content %}
{{ settings_tabs('identity') }}
<div class="page-head"><div><h1>هوية الجهة</h1><p>تظهر في الترويسة والكشوف الرسمية.</p></div></div>
<form method="post" class="card" style="max-width:720px"><input type="hidden" name="csrf_token" value="{{ csrf }}">
  <div class="field"><label for="u">الجامعة</label><input id="u" name="university" value="{{ org.university }}"></div>
  <div class="field"><label for="c">الكلية / الجهة</label><input id="c" name="college" value="{{ org.college }}"></div>
  <div class="field"><label for="t">اسم النظام</label><input id="t" name="system_title" value="{{ org.system_title }}"></div>
  <div class="field"><label for="tg">الشعار النصي <span class="hint">(يظهر تحت اسم النظام)</span></label><input id="tg" name="tagline" value="{{ org.tagline }}"></div>
  <div class="field"><label for="cr">سطر الحقوق <span class="hint">(اختياري، يظهر في التذييل)</span></label><input id="cr" name="credit" value="{{ org.credit }}"></div>
  <button class="btn primary">حفظ</button></form>
{% endblock %}
