<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>غير متصل — إتمام</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; background: #f4f7fb; color: #10243a; text-align: center; padding: 16px; }
  @media (prefers-color-scheme: dark) { body { background: #08131f; color: #e6f2fb; } }
  img { width: 88px; height: 88px; }
  h1 { font-size: 1.3rem; margin: 1rem 0 .4rem; }
  p { margin: 0 0 1.2rem; opacity: .8; }
  .btn { display: inline-block; padding: .6rem 1.4rem; border-radius: 10px; background: #006bb6; color: #fff; text-decoration: none; }
</style>
</head>
<body>
  <main>
    <img src="/static/icon-192.png" alt="">
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تحقّق من اتصالك، ثم أعد المحاولة.</p>
    <a class="btn" href="/">إعادة المحاولة</a>
  </main>
</body>
</html>
